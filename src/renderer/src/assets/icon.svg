<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E0B36"/>
      <stop offset="50%" stop-color="#2D124D"/>
      <stop offset="100%" stop-color="#130624"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#A855F7" stroke-width="6"/>

  <!-- Glowing outer ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#neon)" stroke-width="8" stroke-dasharray="20 10" opacity="0.75" filter="url(#glow)"/>

  <!-- Card stack icon representation -->
  <g transform="translate(106, 126)">
    <!-- Back card -->
    <rect x="50" y="20" width="220" height="140" rx="16" fill="#3B1A64" stroke="#A855F7" stroke-width="3" opacity="0.6" transform="rotate(-8 160 90)"/>
    <!-- Middle card -->
    <rect x="40" y="40" width="220" height="140" rx="16" fill="#4A217B" stroke="#EC4899" stroke-width="4" opacity="0.8" transform="rotate(4 150 110)"/>
    <!-- Front card -->
    <rect x="40" y="80" width="220" height="140" rx="16" fill="url(#bg)" stroke="url(#neon)" stroke-width="5" filter="url(#glow)"/>

    <!-- Wifi waves on front card -->
    <path d="M120 135 A 40 40 0 0 1 180 135" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
    <path d="M130 148 A 25 25 0 0 1 170 148" fill="none" stroke="#A855F7" stroke-width="5" stroke-linecap="round"/>
    <circle cx="150" cy="162" r="5" fill="#EC4899"/>

    <!-- Chip / barcode lines -->
    <rect x="65" y="110" width="35" height="26" rx="4" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
    <line x1="65" y1="123" x2="100" y2="123" stroke="#B45309" stroke-width="2"/>
    <line x1="82" y1="110" x2="82" y2="136" stroke="#B45309" stroke-width="2"/>

    <!-- Mock text lines on card -->
    <line x1="65" y1="190" x2="150" y2="190" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
    <line x1="65" y1="202" x2="110" y2="202" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
